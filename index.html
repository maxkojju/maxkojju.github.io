<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

/* Обновляем селектор тем */
.theme-options {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 10px;
    justify-content: center;
}

.theme-option {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    border: 0px solid transparent;
    transition: all 0.3s ease;
}

.theme-option:hover {
    transform: scale(1.1);
}

.theme-option.active {
    border-color: #ffffff;
    box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
}

<script>
let autoOpenSaved = true;
let domain = 'e621.net';
let postsData = [];
let currentTagsStandard = '';
let postsPerPage = 2;
let currentPostTinder = null;
let currentTagsTinder = '';
let filterNsfw = true;
let proxyTemplate = '';
let delayBeforeNextImage = 3000;
let blacklistTags = '-shota -scat -gore';
let importDataCache = null;

function clearCookies() {
    try {
        localStorage.clear();
        // Сброс маскотов на значения по умолчанию
        const defaultDomainMascot = 'https://raw.githubusercontent.com/maxkojju/maxkojju.github.io/main/1760458897.png';
        const defaultModeMascot = 'https://raw.githubusercontent.com/maxkojju/maxkojju.github.io/main/1760459670.png';
        applyMascotImages(defaultDomainMascot, defaultModeMascot);
        alert('All settings cleared! Mascots reset to default.');
        closeModal('settingsModal');
        loadSettings(); // Перезагрузка настроек
    } catch (e) {
        console.error('Error clearing localStorage:', e);
        alert('Failed to clear settings.');
    }
}
function loadSettings() {
    filterNsfw = getLocalStorage('filterNsfw') !== false;
    proxyTemplate = getLocalStorage('proxyTemplate') || '';
    delayBeforeNextImage = getLocalStorage('delayBeforeNextImage') || 3000;
    autoOpenSaved = getLocalStorage('autoOpenSaved') !== false;
    blacklistTags = getLocalStorage('blacklistTags') || '-shota -scat -gore';
    const savedTheme = getLocalStorage('theme') || 'standard';
    
    // Загрузка URL маскотов
    const mascotDomainUrl = getLocalStorage('mascotDomainUrl') || 'https://raw.githubusercontent.com/maxkojju/maxkojju.github.io/main/1760458897.png';
    const mascotModeUrl = getLocalStorage('mascotModeUrl') || 'https://raw.githubusercontent.com/maxkojju/maxkojju.github.io/main/1760459670.png';
    
    setTheme(savedTheme);
    document.getElementById('filterNsfwToggle').checked = filterNsfw;
    document.getElementById('autoOpenSavedToggle').checked = autoOpenSaved;
    document.getElementById('proxyInput').value = proxyTemplate;
    document.getElementById('delayInput').value = delayBeforeNextImage;
    document.getElementById('blacklistInput').value = blacklistTags;
    
    // Установка значений для полей маскотов
    document.getElementById('mascotDomainInput').value = mascotDomainUrl;
    document.getElementById('mascotModeInput').value = mascotModeUrl;
    
    // Применение маскотов
    applyMascotImages(mascotDomainUrl, mascotModeUrl);

    // Disable NSFW and blacklist settings for nekos.moe
    updateSettingsVisibility();
}
function applyMascotImages(domainUrl, modeUrl) {
    const domainContainer = document.getElementById('domainContainer');
    const modeContainer = document.getElementById('modeContainer');
    
    if (domainUrl) {
        domainContainer.style.backgroundImage = `url('${domainUrl}')`;
    }
    
    if (modeUrl) {
        modeContainer.style.backgroundImage = `url('${modeUrl}')`;
    }
}
function updateSettingsVisibility() {
    const nsfwSetting = document.getElementById('filterNsfwSetting');
    const blacklistSetting = document.getElementById('blacklistSetting');
    if (domain === 'nekos.moe') {
        blacklistSetting.classList.add('disabled');
    } else {
        blacklistSetting.classList.remove('disabled');
    }
    nsfwSetting.classList.remove('disabled'); // NSFW filter available for all domains
}

function saveSettings() {
    filterNsfw = document.getElementById('filterNsfwToggle').checked;
    autoOpenSaved = document.getElementById('autoOpenSavedToggle').checked;
    proxyTemplate = document.getElementById('proxyInput').value.trim();
    delayBeforeNextImage = parseInt(document.getElementById('delayInput').value) || 3000;
    blacklistTags = document.getElementById('blacklistInput').value.trim() || '-shota -scat -gore';
    
    // Сохранение URL маскотов
    const mascotDomainUrl = document.getElementById('mascotDomainInput').value.trim();
    const mascotModeUrl = document.getElementById('mascotModeInput').value.trim();
    
    if (delayBeforeNextImage < 1000) delayBeforeNextImage = 1000;
    if (delayBeforeNextImage > 30000) delayBeforeNextImage = 30000;
    
    const activeTheme = document.querySelector('.theme-option.active').dataset.theme;
    setLocalStorage('theme', activeTheme);
    setLocalStorage('filterNsfw', filterNsfw);
    setLocalStorage('autoOpenSaved', autoOpenSaved);
    setLocalStorage('proxyTemplate', proxyTemplate);
    setLocalStorage('delayBeforeNextImage', delayBeforeNextImage);
    setLocalStorage('blacklistTags', blacklistTags);
    
    // Сохранение URL маскотов
    setLocalStorage('mascotDomainUrl', mascotDomainUrl);
    setLocalStorage('mascotModeUrl', mascotModeUrl);
    
    // Применение новых маскотов
    applyMascotImages(mascotDomainUrl, mascotModeUrl);
    
    alert('Settings saved!');
    closeModal('settingsModal');
}
function setTheme(themeName) {
    // Удаляем все темы
    document.body.className = document.body.className.replace(/theme-\w+/g, '').trim();

    // Добавляем новую
    document.body.classList.add(`theme-${themeName}`);

    // Принудительно пересчитываем стили
    void document.body.offsetHeight;

    // Обновляем активную кнопку
    document.querySelectorAll('.theme-option').forEach(option => {
        option.classList.toggle('active', option.dataset.theme === themeName);
    });
}
function exportSaves() {
    const savedPics = getLocalStorage('savedPics') || [];
    if (savedPics.length === 0) {
        alert('No saved pictures to export.');
        return;
    }
    
    const exportData = {
        version: '1.0',
        exportDate: new Date().toISOString(),
        count: savedPics.length,
        savedPics: savedPics
    };
    
    const dataStr = JSON.stringify(exportData, null, 2);
    const dataBlob = new Blob([dataStr], {type: 'application/json'});
    
    const link = document.createElement('a');
    link.href = URL.createObjectURL(dataBlob);
    link.download = 'exports.bestofe';
    link.click();
    
    URL.revokeObjectURL(link.href);
    console.log('Exported', savedPics.length, 'saved pictures');
}
let themeTimeout;
document.querySelectorAll('.theme-option').forEach(option => {
    option.addEventListener('click', function() {
        clearTimeout(themeTimeout);
        themeTimeout = setTimeout(() => {
            const theme = this.dataset.theme;
            setTheme(theme);
            setLocalStorage('theme', theme);
        }, 100);
    });
});
function importSaves() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.bestofe,application/json';
    
    input.onchange = function(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                importDataCache = JSON.parse(e.target.result);
                const importedPics = importDataCache.savedPics || [];
                
                if (importedPics.length === 0) {
                    alert('No valid saved pictures found in the file.');
                    return;
                }
                
                document.getElementById('importTypeModal').style.display = 'flex';
            } catch (error) {
                console.error('Error parsing import file:', error);
                alert('Error reading import file. Please make sure it is a valid .bestofe file.');
            }
        };
        
        reader.readAsText(file);
    };
    
    input.click();
}

function confirmImport(importType) {
    if (!importDataCache) {
        alert('No import data available.');
        return;
    }
    
    const importedPics = importDataCache.savedPics || [];
    let currentSavedPics = getLocalStorage('savedPics') || [];
    let importedCount = 0;
    
    if (importType === 'overwrite') {
        currentSavedPics = importedPics;
        importedCount = importedPics.length;
    } else {
        importedPics.forEach(pic => {
            if (!currentSavedPics.some(existingPic => existingPic.id === pic.id)) {
                currentSavedPics.push(pic);
                importedCount++;
            }
        });
    }
    
    setLocalStorage('savedPics', currentSavedPics);
    displaySavedPics();

function downloadAllSaves() {
    const savedPics = getLocalStorage('savedPics') || [];
    if (savedPics.length === 0) {
        alert('No saved pictures to download.');
        return;
    }
    
    const confirmed = confirm(`This will download ${savedPics.length} images to your computer. This may take a while. Continue?`);
    if (!confirmed) return;

    const progressDiv = document.createElement('div');
    progressDiv.className = 'download-progress active';
    progressDiv.innerHTML = `
        <h3>Downloading Images</h3>
        <p>Progress: <span id="downloadProgress">0</span>/${savedPics.length}</p>
        <p id="downloadStatus">Starting...</p>
        <button onclick="cancelDownload()" style="margin-top: 10px;">Cancel</button>
    `;
    document.body.appendChild(progressDiv);

    let downloadedCount = 0;
    let errorCount = 0;
    let cancelled = false;

    window.cancelDownload = function() {
        cancelled = true;
        progressDiv.remove();
        alert('Download cancelled');
    };

    function downloadImage(pic) {
        return new Promise((resolve, reject) => {
            const link = document.createElement('a');
            link.href = pic.url;
            const extension = getFileExtension(pic.url);
            link.download = `bestofe_${pic.id}.${extension}`;
            document.body.appendChild(link);
            link.click();
            setTimeout(() => {
                document.body.removeChild(link);
                resolve();
            }, 100);
        });
    }

    function downloadNext() {
        if (cancelled || downloadedCount + errorCount >= savedPics.length) {
            progressDiv.remove();
            if (!cancelled) {
                alert(`Download completed: ${downloadedCount} successful, ${errorCount} failed`);
            }
            return;
        }
        
        const pic = savedPics[downloadedCount + errorCount];
        const progressElement = document.getElementById('downloadProgress');
        const statusElement = document.getElementById('downloadStatus');
        
        statusElement.textContent = `Downloading image ${downloadedCount + errorCount + 1}/${savedPics.length}`;
        
        downloadImage(pic)
            .then(() => {
                downloadedCount++;
                console.log(`Downloaded ${downloadedCount}/${savedPics.length}`);
                progressElement.textContent = downloadedCount + errorCount;
                statusElement.textContent = `Downloaded: ${pic.id}`;
                setTimeout(downloadNext, 500);
            })
            .catch(error => {
                errorCount++;
                console.error(`Failed to download image ${pic.id}:`, error);
                progressElement.textContent = downloadedCount + errorCount;
                statusElement.textContent = `Failed: ${pic.id}`;
                setTimeout(downloadNext, 500);
            });
    }
    
    downloadNext();
}

function getFileExtension(url) {
    const urlParts = url.split('.');
    let extension = 'jpg';
    const possibleExtension = urlParts[urlParts.length - 1].split('?')[0].split('#')[0].toLowerCase();
    
    const validExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'mp4', 'webm', 'avi', 'mov'];
    if (validExtensions.includes(possibleExtension)) {
        extension = possibleExtension;
    }
    
    return extension;
}

// В функции buildApiUrl добавить проверку для nekos.moe
function buildApiUrl(tags, limit) {
    let apiUrl;
    let tagsQuery = tags ? tags.trim() : '';

    if (domain === 'e621.net' || domain === 'e926.net') {
        if (filterNsfw) {
            tagsQuery = tagsQuery ? `${tagsQuery} rating:s` : 'rating:s';
        }
        if (blacklistTags) {
            tagsQuery = tagsQuery ? `${tagsQuery} ${blacklistTags}` : blacklistTags;
        }
        tagsQuery = tagsQuery ? `${tagsQuery} order:random` : 'order:random';
        apiUrl = `https://${domain}/posts.json?tags=${encodeURIComponent(tagsQuery)}&limit=${limit}`;
    } else if (domain === 'nekos.moe') {
        apiUrl = `https://nekos.moe/api/v1/random/image?count=${limit}`;
        if (filterNsfw) apiUrl += '&nsfw=false';
    } else if (domain === 'waifu.im') {
        apiUrl = 'https://api.waifu.im/search';
        let params = [];
        let positiveTags = [];
        let negativeTags = [];
        if (tagsQuery) {
            tagsQuery.split(' ').forEach(t => {
                if (t.startsWith('-')) {
                    negativeTags.push(t.substring(1));
                } else if (t) {
                    positiveTags.push(t);
                }
            });
        }
        if (blacklistTags) {
            blacklistTags.split(' ').forEach(bl => {
                if (bl.startsWith('-')) {
                    negativeTags.push(bl.substring(1));
                }
            });
        }
        positiveTags.forEach(tag => params.push(`included_tags=${encodeURIComponent(tag)}`));
        negativeTags.forEach(tag => params.push(`excluded_tags=${encodeURIComponent(tag)}`));
        if (filterNsfw) {
            params.push('is_nsfw=false');
        } else {
            params.push('is_nsfw=true');
        }
        if (limit > 1) {
            params.push('many=true');
        }
        if (params.length > 0) {
            apiUrl += '?' + params.join('&');
        }
    }

    if (proxyTemplate) {
        apiUrl = proxyTemplate.replace('[URL]', encodeURIComponent(apiUrl));
    }
    return apiUrl;
}

async function fetchRandomPosts(clearTags = false) {
    if (clearTags && domain !== 'nekos.moe') {
        document.getElementById('standardTagInput').value = '';
        currentTagsStandard = '';
    } else if (domain !== 'nekos.moe') {
        currentTagsStandard = document.getElementById('standardTagInput').value.trim();
    } else {
        currentTagsStandard = '';
    }

    const userAgent = 'MyRandomPostFetcher/1.0 (by anonymous user)';
    const apiUrl = buildApiUrl(currentTagsStandard, postsPerPage);

    try {
        const response = await fetch(apiUrl, {
            headers: {
                'User-Agent': userAgent
            }
        });
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        const data = await response.json();
        if (domain === 'nekos.moe') {
            postsData = data.images && data.images.length > 0 ? data.images.map(img => ({
                id: img.id,
                url: `https://nekos.moe/image/${img.id}.jpg`,
                tags: img.tags || {},
                score: { total: img.favourites || 0 },
                fav_count: img.favourites || 0
            })) : [];
        } else if (domain === 'waifu.im') {
            postsData = data.images ? data.images.slice(0, postsPerPage).map(img => ({
                id: img.signature,
                file: { url: img.url },
                tags: img.tags,
                score: { total: 0 },
                fav_count: 0
            })) : [];
        } else {
            postsData = data.posts || [];
        }
        if (postsData.length === 0) {
            throw new Error('No posts returned from API');
        }
        displayPosts(postsData);
    } catch (error) {
        console.error('Error fetching posts:', error);
        document.getElementById('standardPostContainer').innerHTML = '<p>Error loading posts. Try using a VPN or changing the domain.</p>';
        document.getElementById('standardErrorWarning').textContent = 'Error loading posts. Please try again.';
    }
}

            imgElement.src = placeholderUrl;
            imgElement.alt = 'Image failed to load';
        }
    }, 100000);
    imgElement.onload = function() {

        imageLoaded = true;

        imgElement.alt = 'Image not available';
    };

    imgElement.alt = 'Post image';
}

    const element = document.getElementById(elementId);
    if (element) {
        element.classList.add('hidden');
    }
}

function hideFixLink() {
    const fixLink = document.getElementById('fixLink');
    if (fixLink) {
        fixLink.classList.add('hidden');
    }
}

function selectDomain(selectedDomain) {
    domain = selectedDomain;
    document.getElementById('domainContainer').classList.remove('active');
    document.getElementById('modeContainer').classList.add('active');
    
    // Hide tag inputs and settings for nekos.moe only
    const standardTagInput = document.getElementById('standardTagInput');
    const tinderTagInput = document.getElementById('tinderTagInput');
    const standardInputContainer = standardTagInput.parentElement;
    const tinderInputContainer = tinderTagInput.parentElement;
    const sliderContainer = document.querySelector('.slider-container');
    
    if (domain === 'nekos.moe') {
        standardInputContainer.classList.add('hidden');
        tinderInputContainer.classList.add('hidden');
        sliderContainer.classList.add('hidden');
    } else {
        standardInputContainer.classList.remove('hidden');
        tinderInputContainer.classList.remove('hidden');
        sliderContainer.classList.remove('hidden');
    }
    
    // Обновляем видимость настроек
    updateSettingsVisibility();
}
function startStandardMode() {
    document.getElementById('modeContainer').classList.remove('active');
    document.getElementById('standardContainer').classList.add('active');
    hideFixLink();
    document.querySelector('.nav-buttons').classList.remove('hidden');
    document.getElementById('footerLink').style.display = 'block';
    if (domain === 'nekos.moe') {

}

function startTinderMode() {
    document.getElementById('modeContainer').classList.remove('active');
    document.getElementById('tinderContainer').classList.add('active');
    hideFixLink();

    document.getElementById('footerLink').style.display = 'block';

            setTheme(theme);
        });

// Новая функция для настройки drag and drop
function setupDragAndDrop() {
    const dropZone = document.body;

    // Предотвращаем стандартное поведение браузера
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    // Подсветка зоны при перетаскивании
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, unhighlight, false);
    });

    function highlight() {
        dropZone.style.outline = '3px dashed #2a6b9b';
        dropZone.style.outlineOffset = '-10px';
    }

    function unhighlight() {
        dropZone.style.outline = 'none';
        dropZone.style.outlineOffset = '0';
    }

    // Обработка dropped файлов
    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;

        if (files.length > 0) {
            const file = files[0];
            
            // Проверяем тип файла
            if (file.type === 'application/json' || file.name.endsWith('.bestofe')) {
                processDroppedFile(file);
            } else {
                alert('Please drop a valid .bestofe or JSON file');
            }
        }
        
        unhighlight();
    }
}

// Функция для обработки dropped файла
function processDroppedFile(file) {
    const reader = new FileReader();
    
    reader.onload = function(e) {
        try {
            const importData = JSON.parse(e.target.result);
            const importedPics = importData.savedPics || [];
            
            if (importedPics.length === 0) {
                alert('No valid saved pictures found in the file.');
                return;
            }
            
            // Автоматически открываем модальное окно и показываем предпросмотр
            openSavedPics();
            displayPreviewPics(importedPics, file.name);
            
        } catch (error) {
            console.error('Error parsing dropped file:', error);
            alert('Error reading file. Please make sure it is a valid .bestofe file.');
        }
    };
    
    reader.onerror = function() {
        alert('Error reading file. Please try again.');
    };
    
    reader.readAsText(file);
}
